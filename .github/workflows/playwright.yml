name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install Playwright Browsers
        run: npx playwright install chrome --with-deps

      - name: Run Playwright tests
        run: npx bddgen && npx playwright test
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}
          LOG_LEVEL: info
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Check failed test count
        id: check-failures
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          if [ -f test-results.json ]; then
            FAILED_COUNT=$(jq '.stats.unexpected // 0' test-results.json 2>/dev/null || echo 0)
          else
            FAILED_COUNT=0
          fi
          echo "Failed test count: $FAILED_COUNT"
          echo "failed_count=$FAILED_COUNT" >> "$GITHUB_OUTPUT"

      - name: Run AI failure triage
        if: ${{ always() && github.event_name == 'pull_request' && fromJSON(steps.check-failures.outputs.failed_count || '0') > 0 }}
        continue-on-error: true
        run: npm run triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post or update AI triage PR comment
        if: ${{ always() && github.event_name == 'pull_request' && fromJSON(steps.check-failures.outputs.failed_count || '0') > 0 }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- ai-triage-report -->";

            const escapeCell = (value) => String(value).replace(/\|/g, "\\|").replace(/\r?\n/g, " ");

            try {
              if (!fs.existsSync("triage-result.json")) {
                console.log("[ai-triage-comment] No triage-result.json found - nothing to post.");
                return;
              }

              let data;
              try {
                data = JSON.parse(fs.readFileSync("triage-result.json", "utf-8"));
              } catch (err) {
                console.log(`[ai-triage-comment] Could not parse triage-result.json - skipping comment. Reason: ${err.message}`);
                return;
              }

              let body;
              if (data.status === "success" && Array.isArray(data.testResultAnalysis)) {
                const rows = data.testResultAnalysis
                  .map(
                    (item) =>
                      `| ${escapeCell(item.testTitle)} | ${escapeCell(item.category)} | ${escapeCell(item.rootCause)} | ${escapeCell(item.fix)} |`,
                  )
                  .join("\n");
                body = `${marker}\n## AI Failure Triage\n\n| Test | Category | Root Cause | Suggested Fix |\n| --- | --- | --- | --- |\n${rows}\n`;
              } else if (data.status === "fallback" && typeof data.message === "string") {
                body = `${marker}\n## AI Failure Triage\n\n${data.message}\n`;
              } else {
                console.log("[ai-triage-comment] triage-result.json has an unrecognised shape - skipping comment.");
                return;
              }

              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;

              const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
              const existing = comments.data.find((c) => c.body && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                console.log(`[ai-triage-comment] Updated existing comment ${existing.id}.`);
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
                console.log("[ai-triage-comment] Created new triage comment.");
              }
            } catch (err) {
              console.error(`[ai-triage-comment] Failed to post/update PR comment (build not affected): ${err.message}`);
            }

      - name: Configure AWS credentials
        if: ${{ !cancelled() }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Upload Playwright reports to S3
        if: ${{ !cancelled() }}
        run: |
          aws s3 cp playwright-report/ s3://${{ vars.S3_BUCKET_NAME }}/ --recursive

      - name: Invalidate CloudFront cache
        if: ${{ !cancelled() }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Report URL
        if: ${{ !cancelled() }}
        run: |
          echo "### Playwright Report" >> $GITHUB_STEP_SUMMARY
          echo "[View Report](https://d1wu7x6gzdj543.cloudfront.net)" >> $GITHUB_STEP_SUMMARY
